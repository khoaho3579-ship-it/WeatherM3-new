name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tìm project (giải nén WeatherM3.zip nếu có)
        run: |
          set -e
          if [ -f WeatherM3.zip ]; then
            rm -rf _proj && mkdir _proj
            unzip -q WeatherM3.zip -d _proj
          fi
          S=$(find . -maxdepth 4 -name settings.gradle.kts -not -path './_proj/*/.github/*' | head -1)
          if [ -z "$S" ]; then echo "Không thấy settings.gradle.kts"; exit 1; fi
          echo "PROJ=$(dirname "$S")" >> "$GITHUB_ENV"
          echo "Project nằm ở: $(dirname "$S")"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (có sẵn trên máy chủ)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Chuẩn bị khóa ký (nếu có secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Dùng khóa ký từ GitHub Secrets"
          else
            echo "Không có secret -> dùng khóa thử nghiệm cố định app/weatherm3-test.jks"
          fi

      - name: Build APK (release + debug)
        working-directory: ${{ env.PROJ }}
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease assembleDebug -PcomposeReports=true --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Tóm tắt lỗi (hiện ở trang Summary)
        if: failure()
        run: |
          {
            echo '### Lỗi build'
            echo '```'
            if [ -f "$RUNNER_TEMP/build.log" ]; then
              grep -E -A3 '^e: |What went wrong' "$RUNNER_TEMP/build.log" | head -80 || true
            else
              echo "Build chưa chạy tới bước Gradle - xem bước bị đỏ ở cột trái."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherM3-release-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WeatherM3-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Compose stability reports
        uses: actions/upload-artifact@v4
        with:
          name: compose-reports
          path: |
            ${{ env.PROJ }}/app/build/compose_reports
            ${{ env.PROJ }}/app/build/compose_metrics
          if-no-files-found: ignore
          retention-days: 7
